name: Build Node.js for Android

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node 版本: 24(默认) / lts(最新LTS) / 主版本(如 26) / 完整版本(如 24.19.0)'
        default: '24'
        required: false
      target_arch:
        description: '目标架构 (all=全部 4 架构)'
        default: all
        type: choice
        options: [all, arm64, arm, x64, ia32]
      ndk_version:
        description: 'NDK 版本: recommended(默认, 查仓库 ndk-recommended.json) / latest(最新稳定) / 具体版本如 r29 / 留空用 runner 默认'
        default: recommended
        required: false
  schedule:
    # 每月 5 日 02:20 UTC 检查并构建最新 LTS (全部架构)
    # node LTS 补丁版约每月发布一次 (多为周二); 偶数大版本 10 月转 LTS
    - cron: '20 2 5 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 手动选择具体架构时只构建该架构; 默认/schedule 构建全部 4 架构
        arch: ${{ (inputs.target_arch || 'all') == 'all' && fromJSON('["arm64","arm","x64","ia32"]') || fromJSON(format('["{0}"]', inputs.target_arch || 'all')) }}
    steps:
      - uses: actions/checkout@v7

      # 提前解析版本 (cache key 需要), 与 build.sh 的 resolve_version 逻辑一致
      - name: Resolve node version
        run: |
          V="${{ inputs.node_version || '24' }}"
          case "$V" in
            ""|lts|latest)
              VER=$(curl -fsSL --max-time 30 "https://nodejs.org/dist/index.json" | python3 -c 'import json,sys;d=json.load(sys.stdin);l=[x for x in d if x.get("lts")];print(l[0]["version"].lstrip("v") if l else d[0]["version"].lstrip("v"))') ;;
            *.*)
              VER="${V#v}" ;;
            *)
              VER=$(curl -fsSL --max-time 30 "https://nodejs.org/dist/index.json" | python3 -c "import json,sys;d=json.load(sys.stdin);m=[x for x in d if x['version'].startswith('v$V.')];print(m[0]['version'].lstrip('v') if m else '')") ;;
          esac
          [ -n "$VER" ] || { echo "无法解析 node 版本: $V" >&2; exit 1; }
          echo "NODE_VER=$VER" >> "$GITHUB_ENV"
          echo "NODE_MAJOR=${VER%%.*}" >> "$GITHUB_ENV"
          echo "解析到 node $VER (major ${VER%%.*})"

      # NDK 版本解析: recommended(查仓库 ndk-recommended.json, 按 node 大版本) / latest(脚本解析最新稳定) / 具体版本 / 未登记=runner 默认
      - name: Resolve NDK version
        run: |
          INPUT="${{ inputs.ndk_version || 'recommended' }}"
          MAJOR="${NODE_VER%%.*}"
          VER=""
          case "$INPUT" in
            recommended)
              VER=$(python3 -c "import json;d=json.load(open('ndk-recommended.json'));print(d.get('recommended',{}).get('$MAJOR',''))" 2>/dev/null || true)
              if [ -n "$VER" ]; then echo "推荐列表: node $MAJOR -> NDK $VER"; else echo "推荐列表未登记 node $MAJOR, 使用 runner 默认 NDK"; fi ;;
            latest)
              VER=$(python3 scripts/ndk.py latest 2>/dev/null || true)
              if [ -n "$VER" ]; then echo "最新稳定 NDK: $VER"; else echo "::warning::解析最新 NDK 失败, 回退 runner 默认 NDK"; fi ;;
            *)
              VER="$INPUT" ;;
          esac
          echo "NDK_VER=$VER" >> "$GITHUB_ENV"

      - name: Restore NDK cache
        id: cache-ndk
        if: env.NDK_VER != ''
        uses: actions/cache/restore@v6
        with:
          path: ndk-${{ env.NDK_VER }}
          key: ndk-${{ env.NDK_VER }}

      - name: Install NDK
        if: env.NDK_VER != ''
        run: |
          NDK_HOME="${{ github.workspace }}/ndk-${{ env.NDK_VER }}/android-ndk-${{ env.NDK_VER }}"
          if [ ! -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "下载 NDK ${{ env.NDK_VER }} ..."
            if ! curl -fL --retry 3 -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VER }}-linux.zip"; then
              echo "::warning::NDK ${{ env.NDK_VER }} 下载失败, 回退 runner 默认 NDK"
              echo "NDK_VER=" >> "$GITHUB_ENV"
              exit 0
            fi
            mkdir -p "${{ github.workspace }}/ndk-${{ env.NDK_VER }}"
            unzip -q /tmp/ndk.zip -d "${{ github.workspace }}/ndk-${{ env.NDK_VER }}"
            rm -f /tmp/ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "NDK: $NDK_HOME"

      # 缓存: LLVM host 工具链 (跨架构共享, 同大版本内 v8 DEPS 钉定不变)
      - name: Restore LLVM cache
        id: cache-llvm
        uses: actions/cache/restore@v6
        with:
          path: out/llvm-project-build
          key: llvm-${{ env.NODE_MAJOR }}

      # 缓存: node 源码目录 (patch 后, 跨架构共享; tar 恢复保留 mtime, 同版本重跑增量)
      - name: Restore source cache
        id: cache-src
        uses: actions/cache/restore@v6
        with:
          path: out/node-v${{ env.NODE_VER }}
          key: src-${{ env.NODE_VER }}

      # 缓存: ninja 编译产物 (每架构独立; 同版本重跑全 up-to-date, 跨小版本回退增量)
      - name: Restore build output cache
        id: cache-build
        uses: actions/cache/restore@v6
        with:
          path: out/Release
          key: build-${{ matrix.arch }}-${{ env.NODE_MAJOR }}-${{ env.NODE_VER }}
          restore-keys: |
            build-${{ matrix.arch }}-${{ env.NODE_MAJOR }}-

      - name: Install dependencies
        # multilib: arm/ia32 (32 位目标) 的 host 工具链用 -m32 编译, 需要 32 位 glibc/libstdc++ 头文件
        run: sudo apt-get update && sudo apt-get install -y ninja-build xz-utils patch gcc-multilib g++-multilib

      - name: Build
        env:
          # 直接传解析后的完整版本, 与 cache key 保持一致 (build.sh 不再重复解析)
          NODE_VERSION: ${{ env.NODE_VER }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          ./build.sh
          ls -lh out/node-android-*.tar.xz 2>/dev/null || true

      # 保存缓存: always() = 构建失败也保存 (重跑增量); cache-hit=true 跳过 (不覆盖已有)
      # save 用 restore 的 cache-primary-key (主 key), 路径不存在时只警告不失败
      - name: Save NDK cache
        if: always() && env.NDK_VER != '' && steps.cache-ndk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ndk-${{ env.NDK_VER }}
          key: ${{ steps.cache-ndk.outputs.cache-primary-key }}

      - name: Save LLVM cache
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: out/llvm-project-build
          key: ${{ steps.cache-llvm.outputs.cache-primary-key }}

      - name: Save source cache
        if: always() && steps.cache-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: out/node-v${{ env.NODE_VER }}
          key: ${{ steps.cache-src.outputs.cache-primary-key }}

      - name: Save build output cache
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: out/Release
          key: ${{ steps.cache-build.outputs.cache-primary-key }}

      - name: Upload artifact
        if: hashFiles('out/node-android-*.tar.xz') != ''
        uses: actions/upload-artifact@v7
        with:
          name: node-android-${{ matrix.arch }}-${{ env.NODE_VER }}
          path: out/node-android-*.tar.xz
          if-no-files-found: error

      # 历史版本保留: release 按大版本归档 (node-android-<arch>-<major>),
      # 每个版本一个 asset (node-android-<arch>-<version>.tar.xz), 同名自动跳过, 新版本追加
      - name: Upload release
        if: hashFiles('out/node-android-*.tar.xz') != ''
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: node-android-${{ matrix.arch }}-${{ env.NODE_MAJOR }}
          name: Node.js for Android (${{ matrix.arch }}) - ${{ env.NODE_MAJOR }}.x
          artifacts: out/node-android-*.tar.xz
          allowUpdates: true
          replacesArtifacts: false
          body: |
            Node.js for Android (${{ matrix.arch }}), node ${{ env.NODE_MAJOR }}.x 系列, 自包含二进制 (--partly-static)
            本 release 按大版本归档: 每个小版本一个 asset (node-android-<arch>-<version>.tar.xz), 历史版本全部保留
            构建记录: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
